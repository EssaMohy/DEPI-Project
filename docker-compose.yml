# =============================================================================
# DEPI Project - Docker Compose (Base Configuration)
# Services: db, redis, rabbitmq, mailhog, backend, worker, web, plant-analyzer
# =============================================================================

services:
  # =====================================
  # Infrastructure Services
  # =====================================
  db:
    image: postgres:15-alpine
    container_name: depi-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-depiplant}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - depi-network

  redis:
    image: redis:7-alpine
    container_name: depi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - depi-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: depi-rabbitmq
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - depi-network

  mailhog:
    image: mailhog/mailhog
    container_name: depi-mailhog
    restart: unless-stopped
    ports:
      - "${MH_SMTP_PORT:-1025}:1025"
      - "${MH_WEB_PORT:-8025}:8025"
    networks:
      - depi-network

  # =====================================
  # Application Services
  # =====================================
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: production
    container_name: depi-backend
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env.docker
    environment:
      - ANALYZER_URL=http://plant-analyzer:5000/v1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - depi-network

  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: production
    container_name: depi-worker
    restart: unless-stopped
    command: ["dumb-init", "node", "dist/worker.js"]
    env_file:
      - ./apps/backend/.env.docker
    environment:
      - ANALYZER_URL=http://plant-analyzer:5000/v1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - depi-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
    container_name: depi-web
    restart: unless-stopped
    env_file:
      - ./apps/web/.env
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:8000/api/v1
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - depi-network

  plant-analyzer:
    build:
      context: ./apps/plant-analyzer
      dockerfile: Dockerfile
    container_name: depi-plant-analyzer
    restart: unless-stopped
    env_file:
      - ./apps/plant-analyzer/.env.example
    environment:
      - ML_HOST=0.0.0.0
      - ML_PORT=5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - depi-network

# =====================================
# Volumes & Networks
# =====================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  depi-network:
    driver: bridge